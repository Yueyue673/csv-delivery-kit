<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
<title id="title">Synthetic acceptance check: 5,000 records, 3,850 clean, 550 for review, 600 exact duplicates.</title>
<desc id="desc">Three CSV files with 5,000 input records produce 3,850 clean rows, 550 rows for review and 600 exact duplicates. Two CLI runs match byte for byte. This is a data-flow diagram, not a browser screenshot or a customer case.</desc>
<rect x="0.5" y="0.5" width="999" height="399" fill="#f7f5ef" stroke="#d5ddd0"/>
<g font-family="Segoe UI, Microsoft YaHei, sans-serif" fill="#243d34">
<text x="56" y="58" font-size="14" fill="#52695b">Synthetic acceptance check</text>
<text x="56" y="98" font-size="26" font-weight="600">5,000 input records</text>
<text x="56" y="128" font-size="15" fill="#52695b">Three source files, different columns and separators. Original files unchanged.</text>
<line x1="56" y1="156" x2="944" y2="156" stroke="#d5ddd0"/>
<text x="56" y="196" font-size="14" fill="#52695b">Input</text>
<text x="56" y="234" font-size="28" font-weight="600" font-variant-numeric="tabular-nums">5,000</text>
<text x="56" y="260" font-size="14" fill="#52695b">3 source files</text>
<text x="292" y="196" font-size="14" fill="#52695b">Clean output</text>
<text x="292" y="234" font-size="28" font-weight="600" font-variant-numeric="tabular-nums">3,850</text>
<text x="292" y="260" font-size="14" fill="#52695b">clean.csv</text>
<text x="528" y="196" font-size="14" fill="#52695b">Needs review</text>
<text x="528" y="234" font-size="28" font-weight="600" font-variant-numeric="tabular-nums">550</text>
<text x="528" y="260" font-size="14" fill="#52695b">exceptions.csv</text>
<text x="764" y="196" font-size="14" fill="#52695b">Exact duplicates</text>
<text x="764" y="234" font-size="28" font-weight="600" font-variant-numeric="tabular-nums">600</text>
<text x="764" y="260" font-size="14" fill="#52695b">duplicates.csv</text>
<line x1="56" y1="292" x2="944" y2="292" stroke="#d5ddd0"/>
<text x="56" y="328" font-size="15" font-variant-numeric="tabular-nums">3,850 + 550 + 600 = 5,000</text>
<text x="56" y="360" font-size="14" fill="#52695b">Two CLI runs, byte-identical files. Run python verify_batch.py to check fields, source lines, rules and hashes.</text>
</g>
</svg>
