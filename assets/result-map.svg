<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
<title id="title">Five thousand rows. Every record accounted for.</title><desc id="desc">An original synthetic acceptance test: three CSV files with 5000 input records produce 3850 clean rows, 550 rows for review and 600 exact duplicates. Two CLI runs match byte for byte. This is a data-flow diagram, not a browser screenshot or a customer case.</desc>
<rect width="1000" height="420" rx="20" fill="#f3f7f5"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="38" y="42" font-size="11" font-weight="700" letter-spacing="2" fill="#106e61">CSV DELIVERY / REPRODUCIBLE SYNTHETIC CHECK</text>
<text x="38" y="88" font-size="32" font-weight="700" fill="#182c3c">Know where every row went.</text>
<text x="38" y="118" font-size="15" fill="#61717d">Different columns. Different separators. One traceable result.</text>
<rect x="38" y="153" width="237" height="178" rx="14" fill="#182c3c"/>
<text x="60" y="184" font-size="11" letter-spacing="1.5" fill="#a7c6c1">3 SOURCE FILES</text>
<text x="59" y="237" font-size="44" font-weight="700" fill="#ffffff">5,000</text>
<text x="61" y="262" font-size="13" fill="#c2d2d5">input records</text>
<line x1="60" y1="280" x2="251" y2="280" stroke="#ffffff" stroke-opacity=".18"/>
<text x="61" y="306" font-size="12" fill="#c2d2d5">Original source files unchanged</text>
<path d="M291 242h42m-8-7 8 7-8 7" stroke="#8ca69e" stroke-width="2" fill="none"/>
<rect x="350" y="153" width="190" height="178" rx="14" fill="#ffffff" stroke="#dce5e8"/>
<circle cx="375" cy="179" r="5" fill="#106e61"/>
<text x="389" y="183" font-size="11" font-weight="700" letter-spacing=".7" fill="#106e61">CLEAN OUTPUT</text>
<text x="372" y="237" font-size="39" font-weight="700" fill="#106e61">3,850</text>
<text x="373" y="266" font-size="13" fill="#61717d">Merged and aligned</text>
<text x="373" y="306" font-size="12" fill="#182c3c">clean.csv</text>
<rect x="554" y="153" width="190" height="178" rx="14" fill="#ffffff" stroke="#dce5e8"/>
<circle cx="579" cy="179" r="5" fill="#bd8b37"/>
<text x="593" y="183" font-size="11" font-weight="700" letter-spacing=".7" fill="#956314">NEEDS REVIEW</text>
<text x="576" y="237" font-size="39" font-weight="700" fill="#956314">550</text>
<text x="577" y="266" font-size="13" fill="#61717d">Conflicts + missing IDs</text>
<text x="577" y="306" font-size="12" fill="#182c3c">exceptions.csv</text>
<rect x="758" y="153" width="204" height="178" rx="14" fill="#ffffff" stroke="#dce5e8"/>
<circle cx="783" cy="179" r="5" fill="#647c91"/>
<text x="797" y="183" font-size="11" font-weight="700" letter-spacing=".7" fill="#506f86">DUPLICATES</text>
<text x="780" y="237" font-size="39" font-weight="700" fill="#506f86">600</text>
<text x="781" y="266" font-size="13" fill="#61717d">Kept in a separate audit</text>
<text x="781" y="306" font-size="12" fill="#182c3c">duplicates.csv</text>
<text x="38" y="372" font-size="13" font-weight="700" fill="#106e61">2 REAL CLI RUNS / BYTE-IDENTICAL OUTPUTS</text>
<text x="38" y="398" font-size="12" fill="#61717d">Run python verify_batch.py to check full field values, source lines, rules and input hashes yourself.</text>
</g></svg>
